<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=/?404=true">
    <title>404 - Страница не найдена | NetConnect</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="prerender-status-code" content="404">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 8rem;
            margin: 0;
            font-weight: bold;
        }
        h2 {
            font-size: 2rem;
            margin: 1rem 0;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin: 1rem 0 2rem;
        }
        a {
            display: inline-block;
            padding: 1rem 2rem;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        a:hover {
            transform: translateY(-2px);
        }
        .redirect-info {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Страница не найдена</h2>
        <p>К сожалению, запрашиваемая страница не существует.</p>
        <a href="/">Вернуться на главную</a>
        <p class="redirect-info">Вы будете перенаправлены автоматически через секунду...</p>
    </div>
    <script>
        // Перенаправляем на React приложение с параметром 404
        setTimeout(() => {
            window.location.href = '/?404=' + encodeURIComponent(window.location.pathname);
        }, 100);
    </script>
</body>
</html>
